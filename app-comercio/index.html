<!doctype html>
<html lang="es">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pedidos recibidos | Comercio</title>

    <!-- TAGS PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#8936FF">

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
  </head>

  <body>
    <header class="bg-dark text-white py-3">
      <div class="container d-flex justify-content-between align-items-center">
        <h1 class="h4 mb-0">Pedidos recibidos</h1>
        <button type="button" id="btn-permiso"
          class="btn btn-sm btn-outline-light">Activar notificaciones</button>
      </div>
    </header>

    <main class="container py-4">
      <div class="mb-4">
        <h2 class="h3">Gestión de pedidos</h2>
        <p class="text-secondary mb-0"><b>Pedidos registrados: </b><span
            id="cantidadPedidos">0</span></p>
      </div>

      <!-- LISTA DE PEDIDOS (se llena desde app.js en tiempo real) -->
      <div class="row g-4" id="listaPedidos">
        <div class="col-12 text-center text-secondary">
          Cargando pedidos...
        </div>
      </div>
    </main>

    <!-- MODAL DE CONFIRMACIÓN DE ENTREGA -->
    <div class="modal fade" id="modalEntrega" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content text-center">
          <div class="modal-body py-4">
            <h4 class="mb-2">¡Pedido entregado!</h4>
            <p class="text-secondary mb-4" id="mensajeEntrega">
              El pedido ha sido marcado como entregado.
            </p>
            <button type="button" class="btn btn-dark"
              data-bs-dismiss="modal">Aceptar</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="container py-4 text-center text-secondary small">
      <hr>
      <p>Proyecto didáctico · Pedidos PWA (Comercio)</p>
    </footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/app.js"></script>
    <script>

      //--------- PWA CONFIG ---------
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          initServiceWorker();
        });
      }

      function initServiceWorker() {
        navigator.serviceWorker
          .register("sw.js")
          .then(() => console.log("Service worker is registered successfully"))
          .catch((error) =>
            console.error(`failed to register service worker, error: ${error}`),
          );
      }

    </script>

  </body>

</html>
