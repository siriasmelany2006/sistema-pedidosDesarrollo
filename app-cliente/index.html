<!doctype html>
<html lang="es">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Realizar pedido | Cliente</title>

    <!-- TAGS PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ebc249">

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
  </head>

  <body>
    <header class="bg-dark text-white py-3">
      <div class="container d-flex justify-content-between align-items-center">
        <h1 class="h4 mb-0">Realizar pedido</h1>
        <button type="button" id="btn-permiso"
          class="btn btn-sm btn-outline-light">Activar notificaciones</button>
      </div>
    </header>

    <main class="container py-4">
      <div class="row g-4">

        <!-- PRODUCTOS -->
        <section class="col-lg-5">
          <div class="card shadow-sm">
            <div class="card-header bg-light">
              <h3 class="h5 mb-0">Agregar productos</h3>
            </div>
            <div class="card-body">
              <div class="mb-3">
                <label for="producto" class="form-label">Producto</label>
                <select id="producto" class="form-select">
                  <option value="">Cargando productos...</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="cantidad" class="form-label">Cantidad</label>
                <input id="cantidad" class="form-control" type="number"
                  min="1" value="1">
              </div>
              <button type="button" id="btn-agregar"
                class="btn btn-primary w-100">Agregar</button>
            </div>
          </div>
        </section>

        <!-- PEDIDO -->
        <section class="col-lg-7">
          <div class="card shadow-sm">
            <div class="card-header bg-light">
              <h3 class="h5 mb-0">Productos del pedido</h3>
            </div>
            <div class="card-body">
              <div class="table-responsive">
                <table
                  class="table table-bordered table-hover align-middle mb-0">
                  <thead class="table-dark">
                    <tr>
                      <th>Producto</th>
                      <th>Cantidad</th>
                      <th>Subtotal</th>
                      <th>Acciones</th>
                    </tr>
                  </thead>
                  <tbody id="tablaPedido">
                    <tr>
                      <td colspan="4" class="text-center text-secondary">
                        Aún no hay productos agregados
                      </td>
                    </tr>
                  </tbody>
                  <tfoot>
                    <tr>
                      <th colspan="2" class="text-end">Total</th>
                      <th colspan="2" id="totalPedido">₡0</th>
                    </tr>
                  </tfoot>
                </table>
              </div>

              <form id="formPedido" class="mt-4">
                <div class="mb-3">
                  <label for="nombre" class="form-label">Nombre completo</label>
                  <input id="nombre" class="form-control" type="text"
                    placeholder="Ingrese su nombre" required>
                </div>
                <div class="mb-3">
                  <label for="direccion" class="form-label">Dirección de
                    entrega</label>
                  <input id="direccion" class="form-control" type="text"
                    placeholder="Ingrese su dirección" required>
                </div>
                <button type="submit" class="btn btn-dark w-100"
                  id="btn-enviar">Enviar pedido</button>
              </form>
            </div>
          </div>
        </section>
      </div>
    </main>

    <!-- MODAL DE CONFIRMACIÓN -->
    <div class="modal fade" id="modalConfirmacion" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content text-center">
          <div class="modal-body py-4">
            <h4 class="mb-2">¡Pedido enviado!</h4>
            <p class="text-secondary mb-4" id="mensajeConfirmacion">
              Tu pedido ha sido registrado correctamente.
            </p>
            <button type="button" class="btn btn-dark"
              data-bs-dismiss="modal">Aceptar</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="container py-4 text-center text-secondary small">
      <hr>
      <p>Proyecto didáctico · Pedidos PWA (Cliente)</p>
    </footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/app.js"></script>
    <script>

      //--------- PWA CONFIG ---------
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          initServiceWorker();
        });
      }

      function initServiceWorker() {
        navigator.serviceWorker
          .register("sw.js")
          .then(() => console.log("Service worker is registered successfully"))
          .catch((error) =>
            console.error(`failed to register service worker, error: ${error}`),
          );
      }

    </script>

  </body>

</html>
